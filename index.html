<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Трекер досягнень</title>
<meta name="theme-color" content="#f6f7fb">
<meta name="description" content="Трекер особистих і робочих задач та досягнень">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --radius:16px;--radius-sm:10px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
}
[data-theme="light"]{
  --bg:#f5f6fa;--surface:#ffffff;--surface-2:#f0f1f6;--text:#1b1c22;--muted:#6a6e7b;--border:#e4e6ee;
  --primary:#4f46e5;--primary-soft:#ecebff;--on-primary:#fff;
  --danger:#dc3e44;--danger-soft:#fdecec;--success:#22915f;--success-soft:#e3f5ec;--warn:#c97a12;--warn-soft:#fdf2e1;--prio-med:#eab308;
  --shadow:0 1px 2px rgba(20,20,40,.06),0 4px 14px rgba(20,20,40,.06);
}
[data-theme="dark"]{
  --bg:#111217;--surface:#1b1c23;--surface-2:#24252e;--text:#ecedf2;--muted:#9a9eab;--border:#2d2f39;
  --primary:#8f89ff;--primary-soft:#2a2950;--on-primary:#12121a;
  --danger:#ff6b70;--danger-soft:#3a1f22;--success:#4cc68d;--success-soft:#173226;--warn:#f0b057;--warn-soft:#3a2c17;--prio-med:#facc15;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
[data-theme="pink"]{
  --bg:#fff4f8;--surface:#ffffff;--surface-2:#fde9f1;--text:#3b1f2e;--muted:#8d6a7c;--border:#f5d8e4;
  --primary:#d9488a;--primary-soft:#fde3ef;--on-primary:#fff;
  --danger:#d23b4a;--danger-soft:#fdeaec;--success:#2a9467;--success-soft:#e3f5ec;--warn:#c47614;--warn-soft:#fdf1e0;--prio-med:#eab308;
  --shadow:0 1px 2px rgba(120,30,70,.06),0 4px 14px rgba(120,30,70,.08);
}
[data-theme="business"]{
  --bg:#070d1f;--surface:#101a33;--surface-2:#16223f;--text:#e9edf5;--muted:#93a0ba;--border:#24345a;
  --primary:#1c3a78;--primary-soft:#c9d5ea;--on-primary:#fff;
  --danger:#ff7a7f;--danger-soft:#3a2026;--success:#5cc79a;--success-soft:#15322a;--warn:#f0b45e;--warn-soft:#382c18;--prio-med:#e8b500;
  --shadow:0 2px 4px rgba(0,0,0,.5),0 10px 24px rgba(0,0,0,.45);
}
/* «Бізнес»: глибокий темно-синій інтерфейс, блоки — шліфоване срібло (срібні лати) */
[data-theme="business"] body{background:radial-gradient(120% 60% at 50% 0%,#12204a 0%,#070d1f 60%) fixed}
[data-theme="business"] .topbar{background:#070d1f}
[data-theme="business"] .tabbar{background:linear-gradient(180deg,#0f1a36,#070d1f);border-top:1px solid #2a3b63}
[data-theme="business"] .tab.active{color:#d4dceb}
[data-theme="business"] :is(.card,.goal-card,.sheet,.segmented,.chip:not(.on),.select-btn,[id=bell],.tour-tip,.toast){
  --text:#121b2f;--muted:#465269;--surface:#f1f4f8;--surface-2:rgba(255,255,255,.42);--border:rgba(18,27,47,.18);--primary-soft:rgba(28,58,120,.14);color:var(--text);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px),linear-gradient(165deg,#f1f4f8 0%,#c3ccd8 38%,#e9edf2 55%,#aeb8c6 100%);
  border:1px solid #8994a5;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -1px 0 rgba(0,0,0,.15),var(--shadow)}
[data-theme="business"] .segmented button.on{background:linear-gradient(180deg,#fff,#dde3eb);box-shadow:0 1px 3px rgba(0,0,0,.25)}
[data-theme="business"] :is(.fab,.btn.primary,.chip.on){background:linear-gradient(180deg,#2c4f96 0%,#162e63 100%);border:1px solid #c3ccd8;color:#fff}
[data-theme="business"] .theme-opt.on{border-color:#c9d5ea}
[data-theme="business"] .resched-box{background:rgba(201,213,234,.14);--primary:#c9d5ea}
[data-theme="business"] .notice.info{--primary:#c9d5ea;--primary-soft:rgba(201,213,234,.14)}
[data-theme="business"] .sheet .notice.info,[data-theme="business"] .card .notice.info{--primary:#1c3a78;--primary-soft:rgba(28,58,120,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4}
body{min-height:100dvh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 0 10px}
.topbar h1{margin:0;font-size:26px;letter-spacing:-.02em}
.topbar .sub{color:var(--muted);font-size:14px;margin-top:2px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabbar .inner{display:flex;width:100%;max-width:520px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;color:var(--muted);font-size:12px;font-weight:600}
.tab svg{width:24px;height:24px}
.tab.active{color:var(--primary)}
.fab{position:fixed;right:max(18px,calc(50% - 470px));bottom:calc(90px + env(safe-area-inset-bottom));z-index:11;width:58px;height:58px;border-radius:18px;background:var(--primary);color:var(--on-primary);box-shadow:0 6px 20px color-mix(in srgb,var(--primary) 40%,transparent);display:grid;place-items:center}
.fab svg{width:28px;height:28px}
.fab[hidden]{display:none}

/* controls */
.segmented{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;margin:6px 0 12px}
.segmented button{flex:1;padding:8px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.segmented button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}

/* cards */
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;border:1px solid var(--border)}
.goal-card{text-align:left;width:100%;display:flex;flex-direction:column;gap:9px;transition:transform .12s}
.goal-card:active{transform:scale(.985)}
.goal-card .row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.goal-card h3{margin:0;font-size:17px;line-height:1.3;word-break:break-word}
.goal-card.done h3{color:var(--muted)}
.cat-pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);padding:3px 9px;border-radius:999px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--success-soft);color:var(--success)}
.prio{width:10px;height:10px;border-radius:50%;flex:none}
.prio.high{background:var(--danger)}.prio.med{background:var(--prio-med)}.prio.low{background:var(--border)}
.badge.resched{background:var(--primary-soft);color:var(--primary);cursor:pointer;font-size:12.5px}
.letter{background:var(--primary-soft);border-radius:16px;padding:14px 16px;margin:6px 0 16px;text-align:center}
.letter .lh{font-size:13px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.05em}
.letter p{margin:6px 0 0;font-size:19px;font-weight:700;line-height:1.35;word-break:break-word}
.rest-btn{margin-top:8px}
.badge.alert{width:24px;height:24px;padding:0;justify-content:center;font-weight:900;font-size:14px;background:var(--danger);color:#fff}

/* календар */
.date-btn{text-align:left;display:flex;align-items:center;gap:8px;cursor:pointer}
.date-btn.empty{color:var(--muted)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.cal-head b{font-size:18px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .wd{font-size:12px;font-weight:700;color:var(--muted);padding:4px 0}
.cal-grid button{aspect-ratio:1;border-radius:12px;font-weight:600;font-size:15px;max-height:48px}
.cal-grid button:hover{background:var(--surface-2)}
.cal-grid button.past{color:var(--muted);opacity:.6}
.cal-grid button.today{box-shadow:inset 0 0 0 2px var(--primary);color:var(--primary)}
.cal-grid button.sel{background:var(--primary);color:var(--on-primary);opacity:1}
.cal-quick{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 10px}
.cal-quick .chip{cursor:pointer}

/* годинник */
.clock-display{display:flex;justify-content:center;align-items:center;gap:4px;font-size:44px;font-weight:800;margin:4px 0 12px}
.clock-display button{padding:2px 12px;border-radius:14px;background:var(--surface-2);color:var(--muted);font-size:44px;font-weight:800}
.clock-display button.on{background:var(--primary-soft);color:var(--primary)}
.dial{position:relative;width:260px;height:260px;border-radius:50%;background:var(--surface-2);margin:0 auto}
.dial .n{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;z-index:2}
.dial .n.inner{font-size:13px;color:var(--muted);width:34px;height:34px;margin:-17px 0 0 -17px}
.dial .n.sel{background:var(--primary);color:var(--on-primary)}
.dial .hand{position:absolute;left:50%;bottom:50%;width:2px;margin-left:-1px;background:var(--primary);transform-origin:bottom center;z-index:1}
.dial .dot{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--primary)}

/* святковий екран */
.celebrate .sheet{text-align:center;max-width:460px}
.celebrate .pic{width:100%;max-height:48dvh;object-fit:cover;border-radius:18px;display:block;margin:4px 0 16px}
.celebrate .hero{font-size:84px;line-height:1;margin:16px 0 8px}
.celebrate h2{font-size:28px;margin:0 0 6px}
.celebrate .gname{font-size:18px;font-weight:700;margin:8px 0 4px;word-break:break-word}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pics .p{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--surface-2)}
.pics .p img{width:100%;height:100%;object-fit:cover;display:block}
.pics .p button{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.pics .p button svg{width:16px;height:16px}
.pics .add{border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--primary);font-weight:600;font-size:13px;aspect-ratio:1;border-radius:14px}
.pics .add svg{width:26px;height:26px}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
.bar.ok>i{background:var(--success)}
.small{font-size:13px;color:var(--muted)}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .big{font-size:48px;margin-bottom:8px}
.empty h3{color:var(--text);margin:0 0 6px}

.notice{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius-sm);margin-bottom:12px;font-size:14px}
.notice.danger{background:var(--danger-soft);color:var(--danger)}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.info{background:var(--primary-soft);color:var(--primary)}
.notice .grow{flex:1}
.notice b{display:block;margin-bottom:2px}
.notice .act{font-weight:700;text-decoration:underline;color:inherit;white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;font-weight:600;background:var(--surface-2);color:var(--text);min-height:44px}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.success{background:var(--success);color:#fff}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.ghost{background:transparent;color:var(--primary)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}
.btn-row .btn.block{flex:none}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,10,20,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.overlay.open{opacity:1}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .22s}
.overlay.open .sheet{transform:none}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:var(--border);margin:2px auto 10px}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:22px;padding-bottom:22px}.sheet::before{display:none}.sheet{padding-top:18px}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.sheet h2{margin:4px 0 6px;font-size:22px;letter-spacing:-.01em;word-break:break-word}
.sheet h3{margin:20px 0 8px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dialog .sheet{max-width:420px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>span{font-size:14px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);outline:none;min-height:46px}
.input:focus{border-color:var(--primary);background:var(--surface)}
textarea.input{resize:vertical;min-height:80px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub-row{display:flex;gap:6px;margin-bottom:6px}
.sub-row .input{min-height:42px;padding:9px 12px}
.err{color:var(--danger);font-size:13px;margin-top:-8px;margin-bottom:10px}

/* subtasks */
.subs{list-style:none;padding:0;margin:0}
.subs li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.subs li:last-child{border-bottom:0}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--border);display:grid;place-items:center;flex:none;transition:all .15s}
.check svg{width:16px;height:16px;opacity:0;color:#fff}
.check.on{background:var(--success);border-color:var(--success)}
.check.on svg{opacity:1}
.subs .t{flex:1;word-break:break-word}
.subs li.done .t{text-decoration:line-through;color:var(--muted)}
.add-sub{display:flex;gap:8px;margin-top:10px}
.add-sub .input{flex:1}
.progress-big{display:flex;align-items:center;gap:14px;margin:14px 0 4px}
.progress-big .pct{font-size:30px;font-weight:800;letter-spacing:-.02em;min-width:70px}
.progress-big .grow{flex:1}

/* stats */
.stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
@media(min-width:700px){.stat-row{grid-template-columns:repeat(4,1fr)}}
.stat .num{font-size:30px;font-weight:800;letter-spacing:-.02em}
.stat .lbl{font-size:13px;color:var(--muted);font-weight:600}
.section-title{font-size:18px;margin:22px 0 10px}
.weeks{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:18px;overflow:hidden}
.weeks .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.weeks .col i{display:block;width:100%;max-width:34px;background:var(--primary);border-radius:6px 6px 2px 2px;min-height:2px}
.weeks .col.zero i{background:var(--border)}
.weeks .col b{font-size:12px}
.weeks .col span{font-size:10.5px;color:var(--muted);white-space:nowrap;min-height:1.2em;letter-spacing:-.02em}
.catstat{display:flex;flex-direction:column;gap:12px}
.catstat .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;gap:8px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.bdg{text-align:center;padding:14px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
.bdg .e{font-size:34px;line-height:1.1}
.bdg .n{font-weight:700;font-size:14px;margin-top:6px}
.bdg .d{font-size:12px;color:var(--muted);margin-top:3px}
.bdg.locked{opacity:.45}
.bdg.locked .e{filter:grayscale(1)}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.feed li:last-child{border:0}
.feed .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--surface-2);flex:none}

/* settings */
.list{display:flex;flex-direction:column}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border:0}
.list-item .grow{flex:1;min-width:0}
.emoji-box{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:color-mix(in srgb,var(--c,#888) 16%,transparent);flex:none}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:340px){.themes{grid-template-columns:repeat(2,1fr)}}
.theme-opt{border:2px solid var(--border);border-radius:14px;padding:8px 6px;text-align:center;font-weight:600;font-size:14px}
.theme-opt.on{border-color:var(--primary)}
.theme-opt .sw{height:46px;border-radius:9px;margin-bottom:8px;display:flex;align-items:flex-end;padding:6px;gap:4px;border:1px solid rgba(0,0,0,.06)}
.theme-opt .sw i{height:8px;border-radius:4px;flex:1}
.emo-pick{display:flex;gap:12px;align-items:flex-start}
.emo-big{width:64px;height:64px;border-radius:18px;background:var(--surface-2);display:grid;place-items:center;font-size:36px;flex:none;border:2px solid var(--primary)}
.palette input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;border-radius:13px;outline:none;margin:0;display:block}
.hue-range{background:linear-gradient(to right,#c73a3a,#c7a13a,#6fc73a,#3ac78f,#3a9fc7,#3a4ec7,#8a3ac7,#c73a9f,#c73a3a)}
.palette input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--thumb,#fff);border:4px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.35)}
.palette input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--thumb,#fff);border:4px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.35)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emoji-grid button{aspect-ratio:1;border-radius:10px;font-size:20px;background:var(--surface-2);border:2px solid transparent}
.emoji-grid button.on{border-color:var(--primary);background:var(--primary-soft)}
.colors{display:flex;flex-wrap:wrap;gap:10px}
.colors button{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 2px transparent}
.colors button.on{box-shadow:0 0 0 2px var(--c)}

/* дзвіночок, перемикач */
.topwrap{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.bell{position:relative;width:44px;height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--text);flex:none;margin-top:2px}
.bell[hidden]{display:none}
.bell svg{width:22px;height:22px}
.bell #bellCount{position:absolute;top:-5px;right:-5px;min-width:20px;white-space:nowrap;height:20px;padding:0 5px;border-radius:10px;background:var(--primary);color:var(--on-primary);font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.bell #bellCount[hidden]{display:none}
.switch{width:50px;height:30px;border-radius:15px;background:var(--border);position:relative;flex:none;transition:background .2s}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.switch.on{background:var(--primary)}
.switch.on i{left:23px}
.notif{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;width:100%;text-align:left;margin-bottom:6px}
.notif:hover{background:var(--surface-2)}
.notif.unread{background:var(--primary-soft)}
.notif .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--surface);flex:none;border:1px solid var(--border)}
.notif .tt{font-weight:600;word-break:break-word}
.notif.unread .tt{font-weight:800}

/* щоденний підсумок */
.review .sheet{max-width:640px;padding-bottom:0}
.rv-item{border:1px solid var(--border);border-radius:14px;margin-bottom:8px;overflow:hidden;background:var(--surface)}
.rv-row{display:flex;align-items:center;gap:12px;padding:12px;width:100%;text-align:left}
.rv-row .grow{flex:1;min-width:0}
.rv-row .tt{font-weight:600;word-break:break-word}
.rv-row.done .tt{text-decoration:line-through;color:var(--muted)}
.rv-row.sel{background:var(--success-soft)}
.rv-subs{border-top:1px solid var(--border);padding:2px 0 2px 22px;background:var(--surface-2)}
.rv-subs .rv-row{padding:10px 12px}
.chev{width:26px;height:26px;display:grid;place-items:center;color:var(--muted);transition:transform .2s;flex:none}
.chev.open{transform:rotate(90deg)}
.rv-foot{position:sticky;bottom:0;background:var(--surface);padding:12px 0 calc(16px + env(safe-area-inset-bottom));margin-top:8px;border-top:1px solid var(--border)}
.rv-pick{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;padding:0}
.rv-add{margin:6px 12px 10px 0}
.rv-add .input{min-height:42px;padding:9px 12px;background:var(--surface)}
.check.locked{opacity:.55}
.nt-row{display:grid;grid-template-columns:26px 1fr 40px;grid-template-areas:"c t r" ". s .";gap:6px 10px;align-items:center;padding:10px;border:1px solid var(--border);border-radius:14px;margin-bottom:8px;background:var(--surface)}
.nt-row .check{grid-area:c}
.nt-row .nt-text{grid-area:t;min-height:42px;padding:9px 12px}
.nt-row .nt-cat{grid-area:s;min-height:40px;padding:8px 10px}
.nt-row .nt-rm{grid-area:r}
@media(min-width:600px){.nt-row{grid-template-columns:26px 1fr 180px 40px;grid-template-areas:"c t s r"}}

/* похвала */
.celebrate.mega .sheet{background:linear-gradient(160deg,var(--primary-soft),var(--surface) 55%)}
.celebrate.mega h2{font-size:34px;animation:pulse 0.9s ease-in-out infinite alternate}
.celebrate .emrow{font-size:40px;letter-spacing:6px;margin:6px 0 10px;animation:wiggle 1.2s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
@keyframes wiggle{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.burst{position:fixed;inset:0;pointer-events:none;z-index:130;overflow:hidden}
.burst span{position:absolute;left:50%;top:45%;font-size:34px;will-change:transform,opacity}

/* список: сортування й групи */
.mode-seg{margin-top:2px}
.sort-row{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin:-2px 0 10px}
.sort-row .select-btn{width:auto;min-height:38px;padding:7px 12px;font-size:14px;font-weight:600}
.grp{font-size:15px;margin:16px 0 8px;color:var(--text)}
/* календар */
.cal-nav{display:flex;align-items:center;gap:6px;margin:0 0 10px}
.cal-nav b{flex:1;text-align:center;font-size:17px}
.cal-card{padding:10px}
.cm-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cm-wd{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:2px 0 4px}
.cm-day{min-height:74px;border-radius:10px;background:var(--surface-2);padding:4px 3px;display:flex;flex-direction:column;align-items:stretch;gap:2px;text-align:left;overflow:hidden}
.cm-day.other{opacity:.45}
.cm-day.today{box-shadow:inset 0 0 0 2px var(--primary)}
.cm-n{font-size:12px;font-weight:700;padding-left:2px}
.cm-day.today .cm-n{color:var(--primary)}
.cm-chip{display:flex;align-items:center;gap:2px;font-size:10.5px;line-height:1.25;border-radius:5px;padding:1px 3px;background:color-mix(in srgb,var(--c) 18%,transparent);border-left:3px solid var(--c);overflow:hidden;white-space:nowrap}
.cm-chip .t{overflow:hidden;text-overflow:ellipsis}
.cm-chip.done{opacity:.55;text-decoration:line-through}
.cm-more{font-size:10px;color:var(--muted);padding-left:2px}
@media(max-width:560px){ .cm-chip .t{display:none} .cm-chip{justify-content:center;border-left-width:0;font-size:12px} }
.cw-day{padding:6px 2px;border-bottom:1px solid var(--border)} .cw-day:last-child{border:0}
.cw-head{display:flex;gap:6px;align-items:baseline;width:100%;text-align:left;padding:4px 6px;font-size:14px}
.cw-head .small{margin-left:auto}
.cw-day.today .cw-head{color:var(--primary)}
.cw-empty{padding:2px 8px 6px}
.cal-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 10px;margin:4px 0;border-radius:10px;background:color-mix(in srgb,var(--c) 10%,var(--surface));border-left:4px solid var(--c);font-size:14px}
.cal-item .ci-time{font-size:12px;font-weight:700;color:var(--muted);min-width:38px}
.cal-item .ci-t{flex:1;min-width:0;word-break:break-word}
.cal-item.done .ci-t{text-decoration:line-through;color:var(--muted)}
.cal-item .ci-ok{color:var(--success);font-weight:800}
.cd-list{margin-bottom:8px}

/* згортальний блок у налаштуваннях */
.fold-card{padding:0;overflow:hidden;margin-top:18px}
.fold-head{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:14px 16px;font-weight:700;font-size:15px;text-align:left;color:var(--text)}
.fold-body{padding:0 16px 16px}

/* блок «перепланувати» */
.resched-box{background:var(--primary-soft);border-radius:var(--radius-sm);margin-bottom:12px;overflow:hidden}
.resched-head{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:12px 14px;color:var(--primary);font-weight:700;font-size:15px;text-align:left}
.rt{padding:0 10px 10px}
.rt-row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) auto 40px;gap:8px;align-items:center;background:var(--surface);padding:9px 8px 9px 12px;border-radius:12px;margin-top:6px;font-size:14px}
.rt-h{background:transparent;padding:2px 8px 0 12px;margin-top:0;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.rt-title{text-align:left;font-weight:600;word-break:break-word;color:var(--text)}
.rt-cat{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-dl{font-size:13px;color:var(--muted);white-space:nowrap}
.rt-btn{width:38px;height:38px;border-radius:10px;background:var(--primary-soft);font-size:18px;display:grid;place-items:center}

/* власні випадаючі списки */
select.enhanced{display:none!important}
.select-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;cursor:pointer}
.select-btn .sv{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.select-btn svg{flex:none;width:18px;height:18px;color:var(--muted)}
.opt-list{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:13px 14px;border-radius:12px;background:var(--surface-2);font-size:16px;text-align:left;border:2px solid transparent}
.opt.on{background:var(--primary-soft);border-color:var(--primary);font-weight:700;color:var(--primary)}
.opt .ck{width:22px;height:22px;flex:none}

/* голос + ШІ */
.voice-btn{background:linear-gradient(135deg,var(--primary-soft),var(--surface-2));color:var(--primary);font-weight:700;margin-bottom:14px;border:1px dashed color-mix(in srgb,var(--primary) 40%,transparent)}
.voice-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:14px 0 16px;text-align:center}
.mic{width:88px;height:88px;border-radius:50%;background:var(--primary);color:#fff;font-size:38px;display:grid;place-items:center;box-shadow:0 6px 20px color-mix(in srgb,var(--primary) 35%,transparent)}
.mic.wait{opacity:.6;animation:none}
.mic.on{animation:micpulse 1.2s ease-out infinite}
@keyframes micpulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--primary) 55%,transparent)}100%{box-shadow:0 0 0 26px transparent}}
.ai-load{display:flex;flex-direction:column;align-items:center;gap:16px;padding:28px 0;font-weight:700;text-align:center}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid var(--primary-soft);border-top-color:var(--primary);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* інтерактивний тур */
.tour{position:fixed;inset:0;z-index:300}
.card,.themes,.segmented,.field,.two,.rv-item,.section-title,.sheet h3{scroll-margin-top:96px}
.tour-hole{position:fixed;border-radius:14px;box-shadow:0 0 0 3px var(--primary),0 0 0 9999px rgba(12,12,28,.62);transition:all .28s ease;pointer-events:none}
.tour-tip{position:fixed;background:var(--surface);color:var(--text);border-radius:18px;padding:14px 16px 12px;box-shadow:0 10px 40px rgba(0,0,0,.35);transition:top .28s ease,left .28s ease}
.tour-tip .tt{font-size:18px;font-weight:800;margin-bottom:4px}
.tour-tip .tx{font-size:15px;color:var(--muted);line-height:1.45}
.tour-nav{display:flex;gap:6px;align-items:center;margin-top:12px;flex-wrap:wrap}
.tour-nav .btn{min-height:40px;padding:8px 12px;font-size:14px}

/* туторіал */
.tutorial .sheet{max-width:520px;display:flex;flex-direction:column;min-height:min(640px,88dvh)}
.tut-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.tut-top .small{font-weight:700}
.tut-body{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 4px 10px;animation:tutIn .25s ease}
@keyframes tutIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.tut-hero{width:116px;height:116px;border-radius:36px;display:grid;place-items:center;font-size:60px;background:linear-gradient(145deg,var(--primary-soft),var(--surface-2));margin:10px 0 18px;box-shadow:var(--shadow)}
.tut-body h2{font-size:24px;margin:0 0 8px}
.tut-body .lead{color:var(--muted);margin:0 0 14px;max-width:420px}
.tut-list{list-style:none;padding:0;margin:0;text-align:left;width:100%;max-width:420px}
.tut-list li{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:12px;background:var(--surface-2);margin-bottom:7px;font-size:15px}
.tut-list li span:first-child{flex:none;width:24px;text-align:center}
.tut-dots{display:flex;justify-content:center;gap:6px;margin:8px 0 12px;flex-wrap:wrap}
.tut-dots i{width:7px;height:7px;border-radius:50%;background:var(--border);transition:all .2s}
.tut-dots i.on{width:20px;border-radius:4px;background:var(--primary)}
.tut-nav{display:flex;gap:8px}
.tut-nav .btn{flex:1}

/* toast + confetti */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:all .25s;z-index:100;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--primary-soft);font-weight:800;text-decoration:underline}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:120;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.7}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="topbar"><div class="wrap topwrap"><div style="min-width:0"><h1 id="title">Мої задачі</h1><div class="sub" id="subtitle"></div></div>
  <button class="bell" id="bell" aria-label="Сповіщення"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span id="bellCount" hidden>0</span></button>
</div></header>
<main class="wrap" id="view"></main>

<button class="fab" id="fab" aria-label="Нова задача">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabbar"><div class="inner">
  <button class="tab" data-view="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>Задачі</button>
  <button class="tab" data-view="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Досягнення</button>
  <button class="tab" data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Налаштування</button>
</div></nav>

<div id="modals"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" class="sr">
<input type="file" id="picFile" accept="image/*" multiple class="sr">

<script src="firebase-bundle.js"></script>
<script>
"use strict";
/* ========== Константи ========== */
const STORE_KEY = 'achievement-tracker-v1';
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const CP = NATIVE ? window.Capacitor.Plugins : {};
let nativePerm='default';
const APP_VERSION = '2.7.2';
const COLORS = ['#4f46e5','#d9488a','#22915f','#c97a12','#0e8fd1','#8b3fd9','#dc3e44','#5b6475','#0f9b9b','#a0522d'];
const EMOJIS = ['🌱','💼','💪','📚','🧘','❤️','💰','🏠','✈️','🎨','🎵','🍎','🏃','🧠','💻','📈','🎓','👨‍👩‍👧','🐾','🌍','⚽','🛠️','✍️','⭐'];
const DEFAULT_CATS = [
  {id:'personal', name:'Особисте', emoji:'🌱', color:'#22915f'},
  {id:'work', name:'Робоче', emoji:'💼', color:'#4f46e5'}
];
const REMINDERS = [
  ['none','Без нагадування'],['0','У день дедлайну'],['1h','За 1 годину'],['1d','За 1 день'],['3d','За 3 дні'],['1w','За тиждень']
];
const PRIORITIES = {high:'Високий', med:'Середній', low:'Низький'};
const THEME_COLORS = {light:'#f5f6fa', dark:'#111217', pink:'#fff4f8', business:'#070d1f'};

/* ========== Утиліти ========== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
const nowIso = () => new Date().toISOString();
function plural(n, f){ n=Math.abs(n); const a=n%10, b=n%100; if(a===1&&b!==11) return f[0]; if(a>=2&&a<=4&&(b<12||b>14)) return f[1]; return f[2]; }
const DAYS = ['день','дні','днів'];
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseYmd(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
function dayDiff(a,b){return Math.round((startOfDay(b)-startOfDay(a))/86400000)}
function fmtDate(s, withYear){const d=parseYmd(s);const o={day:'numeric',month:'long'};if(withYear||d.getFullYear()!==new Date().getFullYear())o.year='numeric';return d.toLocaleDateString('uk-UA',o)}
function fmtShort(d){return d.getDate()+'.'+pad(d.getMonth()+1)}
function deadlineEnd(g){ if(!g.deadline) return null; const d=parseYmd(g.deadline); if(g.time){const [h,m]=g.time.split(':');d.setHours(+h,+m,0,0)} else d.setHours(23,59,59,0); return d; }
function deadlineInfo(g){
  if(g.status==='done') return g.completedAt ? {text:'✓ Виконано '+fmtDate(ymd(new Date(g.completedAt))), cls:'ok'} : {text:'✓ Виконано', cls:'ok'};
  if(!g.deadline) return null;
  const now=new Date(), end=deadlineEnd(g), diff=dayDiff(now, parseYmd(g.deadline));
  const t = g.time ? ' о '+g.time : '';
  if(end<now){ return {text:'🗓 Перепланувати', cls:'resched', overdue:true}; }
  if(diff===0) return {text:'Сьогодні'+t, cls:'warn'};
  if(diff===1) return {text:'Завтра'+t, cls:'warn'};
  if(diff<=7) return {text:`Через ${diff} ${plural(diff,DAYS)}`, cls: diff<=2?'warn':''};
  return {text:'До '+fmtDate(g.deadline), cls:''};
}
function progress(g){ const n=g.subtasks.length; if(!n) return g.status==='done'?100:0; return Math.round(g.subtasks.filter(s=>s.done).length/n*100); }
const ICONS = {
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
};

/* ========== Сховище ========== */
function defaultState(){
  return {version:1, goals:[], categories:DEFAULT_CATS.map(c=>({...c})),
    settings:{theme:'light', defaultReminder:'1d', lastBackup:null, installHintDismissed:false, dailyReview:true, gender:'', tutorialSeen:false},
    badges:{}, stats:{backups:0}, letters:[], restDays:[]};
}
function normalize(s){
  const d=defaultState();
  if(!s||typeof s!=='object') return d;
  return {
    version:1,
    goals:(Array.isArray(s.goals)?s.goals:[]).filter(g=>g&&g.id&&g.title).map(g=>({
      id:String(g.id), title:String(g.title), desc:g.desc||'', categoryId:g.categoryId||null,
      deadline:g.deadline||'', time:g.time||'', priority:PRIORITIES[g.priority]?g.priority:'med',
      reminder:REMINDERS.some(r=>r[0]===g.reminder)?g.reminder:'none',
      status:['active','done','archived'].includes(g.status)?g.status:'active',

function idb(){ return new Promise((res,rej)=>{ if(!('indexedDB' in window)) return rej('no idb'); const r=indexedDB.open('tracker-bg',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ try{ const db=await idb(); return await new Promise(r=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>r(q.result); q.onerror=()=>r(undefined); }); }catch(e){ return undefined; } }

const OFFSETS = {'0':0,'1h':3600e3,'1d':86400e3,'3d':3*86400e3,'1w':7*86400e3};
function buildSchedule(){
  const items=[];
  for(const g of state.goals){
    if(g.id===TOUR_SAMPLE) continue;
    if(g.status!=='active'||!g.deadline) continue;
    const end=deadlineEnd(g); const sig=g.id+'|'+g.deadline+'|'+(g.time||'');
    if(g.reminder!=='none'){
      let base=parseYmd(g.deadline);
      if(g.time){const [h,m]=g.time.split(':');base.setHours(+h,+m,0,0)} else base.setHours(9,0,0,0);
      const at=base.getTime()-OFFSETS[g.reminder];
      const info = g.reminder==='0' ? 'Сьогодні дедлайн' : 'Наближається дедлайн: '+fmtDate(g.deadline)+(g.time?' о '+g.time:'');
      items.push({key:sig+'|r|'+g.reminder, at, goalId:g.id, title:'⏰ '+g.title, body:info});
    }
    items.push({key:sig+'|over', at:end.getTime()+1000, goalId:g.id, resched:true, title:'🗓 Хочеш перепланувати «'+g.title+'»?', body:'Обери нову дату, коли буде зручно 💛'});
  }
  return items;
}

function dailyItem(d=new Date()){ const day=ymd(d); const at=new Date(d); at.setHours(DAILY_HOUR,0,0,0); return {key:'daily|'+day, at:at.getTime(), type:'daily', title:DAILY_TITLE, body:DAILY_BODY, review:true}; }
async function syncSchedule(){ nativeSchedule(); await idbSet('schedule', buildSchedule()); await idbSet('daily', {enabled: state.settings.dailyReview!==false, hour:DAILY_HOUR}); }
let swReg=null;
async function checkReminders(){
  const sched=buildSchedule(); const notified=(await idbGet('notified'))||{};
  const now=Date.now(); let changed=false; const fresh=[];
  for(const it of sched){
    if(it.at>now||notified[it.key]) continue;
    notified[it.key]=now; changed=true;
    if(it.at < now-3*86400e3 && it.key.endsWith('|over')) continue; // старі прострочення не спамимо
    fresh.push({...it, type: it.key.endsWith('|over')?'overdue':'reminder'});
  }
  if(state.settings.dailyReview!==false){ const d=dailyItem(); if(now>=d.at && !notified[d.key]){ notified[d.key]=now; changed=true; fresh.push(d); } }
  // прибираємо зайве (щоденні ключі тримаємо 7 днів)
  const keys=new Set(sched.map(i=>i.key));
  for(const k in notified){ if(k.startsWith('daily|') ? (now-notified[k]>7*86400e3) : !keys.has(k)) { delete notified[k]; changed=true; } }
  if(changed) await idbSet('notified', notified);
  if(fresh.length){ await addFeed(fresh); for(const it of fresh) await showNotification(it); }
}

function nId(key){ let h=0; for(const c of String(key)) h=(h*31+c.charCodeAt(0))|0; return 10+Math.abs(h)%2000000000; }   // id 1 — щоденний, 2 — тестове

async function nativeScheduleNow(){

/* ========== Досягнення (бейджі) ========== */
function computeStats(){
  const done=state.goals.filter(g=>g.status==='done');
  const dates=new Set();
  let doneSubs=0;
  for(const g of state.goals){ for(const s of g.subtasks){ if(s.done){ doneSubs++; if(s.doneAt) dates.add(ymd(new Date(s.doneAt))); } } if(g.completedAt&&g.status==='done') dates.add(ymd(new Date(g.completedAt))); }
  // поточна серія
  let streak=0; const d=new Date();
  if(!dates.has(ymd(d))) d.setDate(d.getDate()-1);
  while(dates.has(ymd(d))){ streak++; d.setDate(d.getDate()-1); }
  // найдовша серія
  const sorted=[...dates].sort(); let best=0, run=0, prev=null;
  for(const s of sorted){ const cur=parseYmd(s); run = prev && dayDiff(prev,cur)===1 ? run+1 : 1; best=Math.max(best,run); prev=cur; }
  const withDl=done.filter(g=>g.deadline&&g.completedAt);
  const onTime=withDl.filter(g=>new Date(g.completedAt)<=deadlineEnd(g)).length;
  const doneCats=new Set(done.map(g=>g.categoryId).filter(Boolean)).size;
  const perMonth={}; for(const g of done) if(g.completedAt){ const k=g.completedAt.slice(0,7); perMonth[k]=(perMonth[k]||0)+1; }
  const bestMonth=Math.max(0,...Object.values(perMonth));
  return {done, doneCount:done.length, doneSubs, streak, best, onTime, withDl:withDl.length, doneCats, bestMonth,
    active:state.goals.filter(g=>g.status==='active'), created:state.goals.length};
}

    ? (a,b)=>(b.completedAt||b.updatedAt||'').localeCompare(a.completedAt||a.updatedAt||'')
    : (a,b)=>dl(a)-dl(b);

  if(today.length) h+=`<div class="notice warn"><div class="grow"><b>Дедлайн сьогодні: ${today.length}</b>${today.slice(0,3).map(g=>esc(g.title)).join(', ')}</div></div>`;

  if(deferredInstall && !state.settings.installHintDismissed)

  const gmode=uiPref('goalsMode','list');
  h+=`<div class="segmented mode-seg">${[['list','📋 Список'],['cal','📅 Календар']].map(([k,l])=>`<button class="${gmode===k?'on':''}" data-action="goals-mode" data-v="${k}">${l}</button>`).join('')}</div>`;
  const chipsHTML=`<div class="chips"><button class="chip ${ui.cat==='all'?'on':''}" data-action="cat" data-v="all">Усі</button>${state.categories.map(c=>`<button class="chip ${ui.cat===c.id?'on':''}" data-action="cat" data-v="${esc(c.id)}">${esc(c.emoji)} ${esc(c.name)}</button>`).join('')}</div>`;
  if(gmode==='cal') return h+chipsHTML+renderCalendar();
  const counts={active:active.length, done:state.goals.filter(g=>g.status==='done').length, archived:state.goals.filter(g=>g.status==='archived').length};
  h+=`<div class="segmented" role="tablist">${[['active','Активні'],['done','Виконані'],['archived','Архів']].map(([k,l])=>`<button class="${ui.status===k?'on':''}" data-action="status" data-v="${k}">${l}${counts[k]?' · '+counts[k]:''}</button>`).join('')}</div>`;
  const sm=uiPref('sort','deadline');
  h+=`<div class="sort-row"><span class="small">Сортування</span><select class="input sort-sel" data-action="sort" aria-label="Сортування">${SORTS.map(([k,l])=>`<option value="${k}" ${sm===k?'selected':''}>${l}</option>`).join('')}</select></div>`;
  h+=chipsHTML;

  let list=state.goals.filter(g=>g.status===ui.status && (ui.cat==='all'||g.categoryId===ui.cat));
  list=sortGoals(list);
  if(!list.length){
    const msg = ui.status==='active'
      ? (state.goals.length? ['🎯','Тут поки порожньо','Додайте нову задачу кнопкою «+»'] : ['💡','Почнімо!','Створіть свою першу задачу: натисніть «+» унизу праворуч'])
      : ui.status==='done' ? ['🏁','Ще немає виконаних задач','Завершені задачі з’являться тут'] : ['🗄️','Архів порожній','Сюди можна відкладати задачі, які вже не актуальні'];
    return h+`<div class="empty"><div class="big">${msg[0]}</div><h3>${msg[1]}</h3><div>${msg[2]}</div></div>`;
  }
  if(sm==='deadline'){ h+='<div class="grid">'+list.map(goalCard).join('')+'</div>'; }
  else {
    const key=sm==='category'?(g=>g.categoryId||''):(g=>g.priority);
    const groups=[]; for(const g of list){ const k=key(g); let gr=groups.find(x=>x.k===k); if(!gr){ gr={k,items:[]}; groups.push(gr); } gr.items.push(g); }
    for(const gr of groups){
      const title = sm==='category' ? (c=>`${esc(c.emoji)} ${esc(c.name)}`)(cat(gr.k||null)) : PRIO_LABEL[gr.k];
      h+=`<h3 class="grp">${title} <span class="small">· ${gr.items.length}</span></h3><div class="grid">${gr.items.map(goalCard).join('')}</div>`;
    }
  }
  return h+'<div style="height:24px"></div>';
}
/* ---- 📅 Календар задач ---- */
const MONTHS_GEN=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const WD_SHORT=['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
function calItems(){
  const pr={high:0,med:1,low:2}, by={};
  for(const g of state.goals){ if(g.status==='archived'||!g.deadline||g.id===TOUR_SAMPLE&&!tourActive) continue; if(ui.cat!=='all'&&g.categoryId!==ui.cat) continue; (by[g.deadline]=by[g.deadline]||[]).push(g); }
  for(const k in by) by[k].sort((a,b)=>(a.status==='done')-(b.status==='done') || (a.time||'99').localeCompare(b.time||'99') || pr[a.priority]-pr[b.priority]);
  return by;
}
function calItem(g){
  const c=cat(g.categoryId), done=g.status==='done', od=!done&&deadlineInfo(g)&&deadlineInfo(g).overdue;
  return `<button class="cal-item ${done?'done':''}" data-action="open" data-id="${esc(g.id)}" style="--c:${esc(c.color)}"><span class="ci-time">${g.time||''}</span><span class="ci-t">${esc(c.emoji)} ${esc(g.title)}</span>${done?'<span class="ci-ok">✓</span>':''}${od?'<span class="ci-od" title="Варто перепланувати">🗓</span>':''}</button>`;
}
function renderCalendar(){
  const cm=uiPref('calMode','month'); const d0=ui.calDate?new Date(ui.calDate):startOfDay(new Date()); ui.calDate=d0;
  const by=calItems(), today=ymd(new Date());
  const monStart=d=>{ const x=startOfDay(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };
  let title='', body='';
  if(cm==='month'){
    const y=d0.getFullYear(), mo=d0.getMonth(); title=MONTHS[mo]+' '+y;
    let cur=monStart(new Date(y,mo,1)); const end=new Date(y,mo+1,0);
    let cells=WD_SHORT.map(w=>`<div class="cm-wd">${w}</div>`).join('');
    while(cur<=end || (cur.getDay()+6)%7!==0){
      const k=ymd(cur), list=by[k]||[], other=cur.getMonth()!==mo;
      cells+=`<button class="cm-day ${other?'other':''} ${k===today?'today':''}" data-action="cal-day" data-d="${k}"><span class="cm-n">${cur.getDate()}</span>${list.slice(0,3).map(g=>{ const c=cat(g.categoryId); return `<span class="cm-chip ${g.status==='done'?'done':''}" style="--c:${esc(c.color)}"><span class="e">${esc(c.emoji)}</span><span class="t">${esc(g.title)}</span></span>`; }).join('')}${list.length>3?`<span class="cm-more">+${list.length-3}</span>`:''}</button>`;
      cur.setDate(cur.getDate()+1); if(cur>end && (cur.getDay()+6)%7===0) break;
    }
    body=`<div class="cm-grid">${cells}</div>`;
  } else if(cm==='week'){
    const st=monStart(d0), en=new Date(st); en.setDate(en.getDate()+6);
    title = st.getMonth()===en.getMonth() ? `${st.getDate()}–${en.getDate()} ${MONTHS_GEN[en.getMonth()]}` : `${st.getDate()} ${MONTHS_GEN[st.getMonth()]} – ${en.getDate()} ${MONTHS_GEN[en.getMonth()]}`;
    for(let i=0;i<7;i++){ const d=new Date(st); d.setDate(st.getDate()+i); const k=ymd(d), list=by[k]||[];
      body+=`<div class="cw-day ${k===today?'today':''}"><button class="cw-head" data-action="cal-day" data-d="${k}"><b>${WD_SHORT[i]}</b> ${fmtShort(d)}${k===today?' · сьогодні':''}<span class="small">${list.length?list.length+' '+plural(list.length,['задача','задачі','задач']):''}</span></button>${list.length?list.map(calItem).join(''):'<div class="small cw-empty">—</div>'}</div>`; }
  } else {
    const k=ymd(d0), list=by[k]||[], wd=d0.toLocaleDateString('uk-UA',{weekday:'long'});
    title = wd.charAt(0).toUpperCase()+wd.slice(1)+', '+d0.getDate()+' '+MONTHS_GEN[d0.getMonth()];
    body = (list.length?`<div class="cd-list">${list.map(calItem).join('')}</div>`:`<div class="empty" style="padding:26px 10px"><div class="big">🌿</div><div>На цей день задач немає</div></div>`)
      + `<button class="btn ghost block" data-action="cal-add" data-d="${k}">＋ Додати задачу на цей день</button>`;
  }
  const noDl=state.goals.filter(g=>g.status==='active'&&!g.deadline&&(ui.cat==='all'||g.categoryId===ui.cat)).length;
  return `<div class="segmented cal-seg" style="margin-top:0">${[['month','Місяць'],['week','Тиждень'],['day','День']].map(([k,l])=>`<button class="${cm===k?'on':''}" data-action="cal-mode" data-v="${k}">${l}</button>`).join('')}</div>
    <div class="cal-nav"><button class="icon-btn" data-action="cal-nav" data-v="-1" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <b>${title}</b><button class="icon-btn" data-action="cal-nav" data-v="1" aria-label="Вперед"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="chip" data-action="cal-today">Сьогодні</button></div>
    <div class="card cal-card">${body}</div>
    ${noDl?`<div class="small" style="text-align:center;margin:12px 0">${noDl===1?'Ще 1 задача без дедлайну — вона':`Ще ${noDl} ${plural(noDl,['задача','задачі','задач'])} без дедлайну — вони`} у режимі «📋 Список»</div>`:''}<div style="height:24px"></div>`;
}
function goalCard(g){
  const c=cat(g.categoryId), p=progress(g), di=deadlineInfo(g), n=g.subtasks.length, dn=g.subtasks.filter(s=>s.done).length;
  return `<button class="card goal-card ${g.status==='done'?'done':''}" data-action="open" data-id="${esc(g.id)}">
    <div class="row"><span class="cat-pill" style="--c:${esc(c.color)}">${esc(c.emoji)} ${esc(c.name)}</span>${g.status==='done'?'':`<span class="prio ${g.priority}" title="Пріоритет: ${PRIORITIES[g.priority]}"></span>`}</div>
    <h3>${esc(g.title)}</h3>
    ${n||g.status!=='done'?`<div class="bar ${p===100?'ok':''}"><i style="width:${p}%"></i></div>`:''}
    <div class="row"><span class="small">${n?`${dn} з ${n} ${plural(n,['кроку','кроків','кроків'])} · ${p}%`:(g.status==='done'?'':'Без кроків')}</span>${di?(di.overdue?`<span class="badge resched" role="button" tabindex="0" data-action="resched" data-id="${esc(g.id)}">${esc(di.text)}</span>`:`<span class="badge ${di.cls}">${esc(di.text)}</span>`):''}</div>
  </button>`;
}

function renderStats(){
  const s=computeStats(); const now=new Date();
  const overdue=s.active.filter(g=>{const i=deadlineInfo(g);return i&&i.overdue}).length;
  const weekStart=startOfDay(now); weekStart.setDate(weekStart.getDate()-((weekStart.getDay()+6)%7));
  const monthStart=new Date(now.getFullYear(),now.getMonth(),1);
  const thisWeek=s.done.filter(g=>g.completedAt&&new Date(g.completedAt)>=weekStart).length;
  const thisMonth=s.done.filter(g=>g.completedAt&&new Date(g.completedAt)>=monthStart).length;
  let h=`<div class="stat-row">
    <div class="card stat"><div class="num">${s.doneCount}</div><div class="lbl">Виконано задач</div></div>
    <div class="card stat"><div class="num">${s.active.length}</div><div class="lbl">Активних</div></div>
    <div class="card stat"><div class="num">${thisMonth}</div><div class="lbl">Виконано цього місяця</div></div>
    <div class="card stat"><div class="num">${s.doneSubs}</div><div class="lbl">Кроків зроблено</div></div>
  </div>
  <div class="card"><div class="row" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
    <div><b>${thisWeek}</b> <span class="small">виконано цього тижня</span></div>
    <div><b>${state.restDays.length}</b> <span class="small">${plural(state.restDays.length,['день','дні','днів'])} відпочинку 🌿</span></div>
  </div></div>`;

  // графік: дні / тижні / місяці
  const MSHORT=['Січ','Лют','Бер','Кві','Тра','Чер','Лип','Сер','Вер','Жов','Лис','Гру'];
  const buckets=[]; const mode=ui.chart;
  if(mode==='days'){ for(let i=9;i>=0;i--){ const st=startOfDay(now); st.setDate(st.getDate()-i); const en=new Date(st); en.setDate(en.getDate()+1); buckets.push({st,en,label:i===0?'Сьог.':(i%2===0?fmtShort(st):'')}); } }
  else if(mode==='months'){ for(let i=11;i>=0;i--){ const st=new Date(now.getFullYear(),now.getMonth()-i,1); const en=new Date(st.getFullYear(),st.getMonth()+1,1); buckets.push({st,en,label:MSHORT[st.getMonth()]}); } }
  else { for(let i=7;i>=0;i--){ const st=new Date(weekStart); st.setDate(st.getDate()-i*7); const en=new Date(st); en.setDate(en.getDate()+7); buckets.push({st,en,label:i===0?'Цей':fmtShort(st)}); } }
  for(const b of buckets) b.n=s.done.filter(g=>g.completedAt&&new Date(g.completedAt)>=b.st&&new Date(g.completedAt)<b.en).length;
  const max=Math.max(1,...buckets.map(w=>w.n));
  const aria={days:'останні 10 днів',weeks:'останні 8 тижнів',months:'останні 12 місяців'}[mode];
  h+=`<h2 class="section-title">Виконані задачі</h2><div class="card">
    <div class="segmented" style="margin-top:0">${[['days','Дні'],['weeks','Тижні'],['months','Місяці']].map(([k,l])=>`<button class="${mode===k?'on':''}" data-action="chart" data-v="${k}">${l}</button>`).join('')}</div>
    <div class="weeks" role="img" aria-label="Кількість виконаних задач за ${aria}">${buckets.map(w=>`<div class="col ${w.n?'':'zero'}"><b>${w.n||''}</b><i style="height:${Math.max(2,w.n/max*100)}%"></i><span>${w.label}</span></div>`).join('')}</div></div>`;

  // категорії
  const rows=state.categories.map(c=>{const all=state.goals.filter(g=>g.categoryId===c.id&&g.status!=='archived');return {c, all:all.length, done:all.filter(g=>g.status==='done').length}}).filter(r=>r.all);
  if(rows.length){
    h+=`<h2 class="section-title">За категоріями</h2><div class="card catstat">${rows.map(r=>`<div><div class="top"><span>${esc(r.c.emoji)} ${esc(r.c.name)}</span><span class="small">${r.done} з ${r.all}</span></div><div class="bar"><i style="width:${Math.round(r.done/r.all*100)}%;background:${esc(r.c.color)}"></i></div></div>`).join('')}</div>`;
  }

  // бейджі
  const got=BADGES.filter(b=>state.badges[b.id]).length;
  h+=`<h2 class="section-title">Нагороди · ${got} з ${BADGES.length}</h2><div class="badges">${BADGES.map(b=>{const u=state.badges[b.id];return `<div class="bdg ${u?'':'locked'}"><div class="e">${b.e}</div><div class="n">${b.n}</div><div class="d">${u?'Отримано '+fmtShort(new Date(u)):b.d}</div></div>`}).join('')}</div>`;

  // стрічка
  const feed=[...s.done].sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||'')).slice(0,15);
  h+=`<h2 class="section-title">Стрічка досягнень</h2>`;
  h+= feed.length ? `<div class="card"><ul class="feed">${feed.map(g=>{const c=cat(g.categoryId);return `<li><div class="ic" style="background:color-mix(in srgb,${esc(c.color)} 16%,transparent)">${esc(c.emoji)}</div><div style="flex:1;min-width:0"><div style="font-weight:600;word-break:break-word">${esc(g.title)}</div><div class="small">${g.completedAt?new Date(g.completedAt).toLocaleDateString('uk-UA',{day:'numeric',month:'long',year:'numeric'}):''}</div></div><button class="icon-btn" data-action="open" data-id="${esc(g.id)}" aria-label="Відкрити">›</button></li>`}).join('')}</ul></div>`
    : `<div class="empty" style="padding:24px"><div class="big">🌟</div><div>Завершуйте задачі, і вони з’являться тут</div></div>`;
  return h+'<div style="height:24px"></div>';
}

/* ========== Модальні вікна ========== */
/* Кнопка «Назад» на Android закриває верхнє вікно: тримаємо один запис історії, поки відкрите хоч одне вікно */
const modalStack=[]; let ignorePop=0, histEntry=false, pendingBack=null;
function ensureHistEntry(){ if(pendingBack){ clearTimeout(pendingBack); pendingBack=null; } if(!histEntry){ history.pushState({modal:1},''); histEntry=true; } }
function releaseHistEntry(){ if(pendingBack) clearTimeout(pendingBack); pendingBack=setTimeout(()=>{ pendingBack=null; if(!modalStack.length && histEntry){ histEntry=false; ignorePop++; history.back(); } },40); }
function openModal(renderFn, opts={}){
  const ov=document.createElement('div'); ov.className='overlay'+(opts.dialog?' dialog':'')+(opts.cls?' '+opts.cls:'');
  ov.innerHTML='<div class="sheet" role="dialog" aria-modal="true"></div>';
  const sheet=ov.firstChild; $('#modals').appendChild(ov);
  const m={ov, sheet, closed:false,
    render(){ sheet.innerHTML=renderFn(m); opts.onRender&&opts.onRender(m); },
    close(fromPop){ if(m.closed) return; m.closed=true; ov.classList.remove('open'); setTimeout(()=>ov.remove(),220);
      const i=modalStack.indexOf(m); if(i>=0) modalStack.splice(i,1);
      if(fromPop){ histEntry=false; if(modalStack.length) ensureHistEntry(); }
      else if(!modalStack.length) releaseHistEntry();
      opts.onClose&&opts.onClose(); }
  };
  ov.addEventListener('click',e=>{ if(e.target===ov) m.close(); });
  m.render(); modalStack.push(m); ensureHistEntry();
  requestAnimationFrame(()=>ov.classList.add('open'));
  return m;
}
window.addEventListener('popstate',()=>{ if(ignorePop>0){ignorePop--;return;} const top=modalStack[modalStack.length-1]; if(top) top.close(true); });
function dialog({title, text, buttons}){
  return new Promise(res=>{
    let val=null;
    const m=openModal(()=>`<h2>${esc(title)}</h2>${text?`<p style="color:var(--muted);margin:6px 0 18px">${text}</p>`:''}<div class="btn-row" style="flex-direction:column">${buttons.map((b,i)=>`<button class="btn ${b.kind||''} block" data-i="${i}">${esc(b.label)}</button>`).join('')}</div>`, {dialog:true, onClose:()=>res(val)});
    m.sheet.addEventListener('click',e=>{const b=e.target.closest('[data-i]'); if(!b) return; val=buttons[+b.dataset.i].value; m.close();});
  });
}
const confirmDel=(title,text)=>dialog({title,text,buttons:[{label:'Видалити',value:true,kind:'danger'},{label:'Скасувати',value:false}]});

    checkBadges(); after&&after(); render();
  });
  if(!g && !tourActive) setTimeout(()=>form.elements.title.focus(),250);

function openDatePicker(value, onPick, title='Дедлайн'){
  let sel=value||''; const view=sel?parseYmd(sel):new Date(); view.setDate(1);
  const today=ymd(new Date());
  const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
  const addMonth=()=>{const d=new Date();d.setMonth(d.getMonth()+1);return ymd(d)};
  const m=openModal(()=>{
    const y=view.getFullYear(), mo=view.getMonth(), first=(new Date(y,mo,1).getDay()+6)%7, days=new Date(y,mo+1,0).getDate();

      ${sel?'<button type="button" class="btn ghost block" data-a="clear" style="margin-top:12px">Без дедлайну</button>':''}`;
  }, {dialog:true});
  m.sheet.addEventListener('click',e=>{

/* ---- Годинник для вибору часу ---- */
function openTimePicker(value, onPick){
  let [h,mi]=(value||'12:00').split(':').map(Number); let stage='h';
  const R_OUT=105, R_IN=68, C=130;
  const pos=(k,r)=>{ const a=k*Math.PI/6; return `left:${C+r*Math.sin(a)}px;top:${C-r*Math.cos(a)}px`; };
  const m=openModal(()=>{
    let nums='', handLen, handAng;
    if(stage==='h'){
      for(let k=0;k<12;k++){ const vo=k===0?12:k, vi=k===0?0:k+12;
        nums+=`<button type="button" class="n ${h===vo?'sel':''}" style="${pos(k,R_OUT)}" data-h="${vo}">${vo}</button>`;
        nums+=`<button type="button" class="n inner ${h===vi?'sel':''}" style="${pos(k,R_IN)}" data-h="${vi}">${pad(vi)}</button>`; }
      const inner = h===0 || h>12; handLen=inner?R_IN:R_OUT; handAng=(h%12)*30;
    } else {
      for(let k=0;k<12;k++){ const v=k*5; nums+=`<button type="button" class="n ${mi===v?'sel':''}" style="${pos(k,R_OUT)}" data-m="${v}">${pad(v)}</button>`; }
      handLen=R_OUT; handAng=mi*6;
    }
    return `<div class="sheet-head"><h2>Час дедлайну</h2><button type="button" class="icon-btn" data-a="close" aria-label="Закрити">${ICONS.close}</button></div>
      <div class="cal-quick" style="justify-content:center">${['09:00','12:00','15:00','18:00','21:00'].map(t=>`<button type="button" class="chip" data-quick="${t}">${t}</button>`).join('')}</div>
      <div class="clock-display"><button type="button" class="${stage==='h'?'on':''}" data-a="sh">${pad(h)}</button>:<button type="button" class="${stage==='m'?'on':''}" data-a="sm">${pad(mi)}</button></div>
      <div class="small" style="text-align:center;margin:-6px 0 10px">${stage==='h'?'Оберіть годину':'Оберіть хвилини'}</div>
      <div class="dial"><div class="hand" style="height:${handLen}px;transform:rotate(${handAng}deg)"></div><div class="dot"></div>${nums}</div>
      <div class="btn-row" style="margin-top:18px">${value?'<button type="button" class="btn ghost" data-a="clear">Без часу</button>':''}<button type="button" class="btn primary" data-a="ok">Готово</button></div>`;
  }, {dialog:true});
  m.sheet.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.h!==undefined){ h=+b.dataset.h; stage='m'; m.render(); return; }
    if(b.dataset.m!==undefined){ mi=+b.dataset.m; m.render(); return; }
    if(b.dataset.quick){ onPick(b.dataset.quick); m.close(); return; }
    const a=b.dataset.a;
    if(a==='close') m.close();
    if(a==='sh'){ stage='h'; m.render(); }
    if(a==='sm'){ stage='m'; m.render(); }
    if(a==='clear'){ onPick(''); m.close(); }
    if(a==='ok'){ onPick(pad(h)+':'+pad(mi)); m.close(); }
  });
}

/* ---- Список сповіщень ---- */
async function openBellList(){
  await loadFeed();
  const icon={daily:'📝',reminder:'⏰',overdue:'🗓'};
  const when=t=>{ const d=new Date(t); return fmtShort(d)+', '+pad(d.getHours())+':'+pad(d.getMinutes()); };
  const m=openModal(()=>`<div class="sheet-head"><h2>Сповіщення</h2><button class="icon-btn" data-a="close" aria-label="Закрити">${ICONS.close}</button></div>
    ${feed.length?`<div class="btn-row" style="margin-bottom:10px">${feed.some(f=>!f.read)?'<button class="btn ghost" data-a="read-all">Позначити всі прочитаними</button>':''}<button class="btn ghost" data-a="clear-all">Очистити</button></div>`:''}
    ${feed.length?feed.map((f,i)=>`<button class="notif ${f.read?'':'unread'}" data-i="${i}"><div class="ic">${icon[f.type]||'🔔'}</div><div style="flex:1;min-width:0"><div class="tt">${esc(f.title)}</div>${f.body?`<div class="small">${esc(f.body)}</div>`:''}<div class="small" style="margin-top:2px">${when(f.at)}</div></div></button>`).join('')
      :`<div class="empty" style="padding:30px 10px"><div class="big">🔔</div><h3>Сповіщень поки немає</h3><div>Щодня о ${DAILY_HOUR}:00 тут з’являтиметься нагадування підбити підсумки дня</div></div>`}`);
  m.sheet.addEventListener('click',async e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.a==='close') return m.close();
    if(b.dataset.a==='read-all'){ feed.forEach(f=>f.read=true); await saveFeed(); m.render(); return; }
    if(b.dataset.a==='clear-all'){ feed=[]; await saveFeed(); m.render(); return; }
    if(b.dataset.i!==undefined){
      const f=feed[+b.dataset.i]; f.read=true; await saveFeed(); m.close();
      if(f.type==='daily') openReview();
      else if(f.goalId && goalById(f.goalId)){ openGoal(f.goalId); if(f.type==='overdue' && goalById(f.goalId).status==='active') reschedule(f.goalId); }
      else toast('Цю задачу вже видалено');
    }
  });
}

/* ---- Щоденний підсумок: «Що зроблено сьогодні?» ---- */
function reviewGoals(){
  const act=state.goals.filter(g=>g.status==='active');
  const pr={high:0,med:1,low:2};
  return act.sort((a,b)=>{
    const da=a.deadline?deadlineEnd(a).getTime():Infinity, db=b.deadline?deadlineEnd(b).getTime():Infinity;
    return da-db || pr[a.priority]-pr[b.priority] || a.createdAt.localeCompare(b.createdAt);
  }).slice(0,10);
}
async function openReview(){
  if(modalStack.some(x=>x.isReview)) return;

  if(!tourActive){ await loadFeed(); let ch=false; feed.forEach(f=>{ if(f.type==='daily'&&!f.read){ f.read=true; ch=true; } }); if(ch) await saveFeed(); }

  const confirmLabel=()=>changes()?`Підтвердити (${changes()})`:'Відміть виконане';
  const chev=open=>`<span class="chev ${open?'open':''}"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>`;

      : `<p class="small" style="margin:0 0 14px">Активних задач немає 🌿 Але нижче можна записати, що ${G3('ти зробив','ти зробила','вдалося зробити')} сьогодні.</p>`;
    if(AI_OK) h+=`<button class="btn voice-btn block" data-a="voice" style="margin-bottom:14px">🎤 Розкажи голосом — ШІ сам відмітить зроблене</button>`;
    for(const g of list){

      const pend=pending[g.id]||[], allSubs=[...g.subtasks, ...pend.map(p=>({...p,done:false,isNew:true}))];
      const isOpen=open.has(g.id);
      if(allSubs.length){

        h+=`<div class="rv-item"><button class="rv-row" data-a="expand" data-id="${esc(g.id)}">${chev(isOpen)}

          ${isOpen?`<div class="rv-subs">${allSubs.map(s=>{const k='s|'+g.id+'|'+s.id, on=s.done||sel.has(k);
            if(s.done) return `<div class="rv-row done">${chk(true,true)}<div class="grow"><div class="tt">${esc(s.title)}</div></div></div>`;
            return `<div class="rv-row ${sel.has(k)?'sel':''}"><button class="rv-pick" data-a="pick" data-k="${esc(k)}">${chk(on)}<div class="grow"><div class="tt">${esc(s.title)}${s.isNew?' <span class="badge" style="font-size:11px">новий</span>':''}</div></div></button>${s.isNew?`<button class="icon-btn" data-a="rm-step" data-g="${esc(g.id)}" data-s="${esc(s.id)}" aria-label="Прибрати новий крок">${ICONS.close}</button>`:''}</div>`;}).join('')}

        <input class="input nt-text" data-nt="text" value="${esc(r.text)}" placeholder="Напр.: Дзвінок бабусі" maxlength="140" autocomplete="off">

  m.sheet.addEventListener('submit',e=>{
    const f=e.target.closest('[data-addstep]'); if(!f) return; e.preventDefault();
    const gid=f.dataset.addstep, t=f.elements.t.value.trim(); if(!t){ f.elements.t.focus(); return; }

    sel.delete('g|'+gid);            // задача тепер має кроки — відмічаються кроки, а не вся задача
    open.add(gid); m.render();
    const nf=$(`[data-addstep="${CSS.escape(gid)}"] input`, m.sheet); nf&&nf.focus();
  });
  // застосувати все відмічене; повертає кількість виконаного
  async function apply(){
    const t=nowIso(); let n=0, added=0; const touched=new Set();
    for(const [gid,arr] of Object.entries(pending)){ const g=goalById(gid); if(!g) continue; for(const p of arr) g.subtasks.push({id:p.id,title:p.title,done:false,doneAt:null}); touch(g); }
    for(const k of sel){
      const [kind,gid,sid]=k.split('|'); const g=goalById(gid); if(!g) continue;
      if(kind==='g' && g.status==='active' && !g.subtasks.length){ g.status='done'; g.completedAt=t; touch(g); n++; }
      if(kind==='s'){ const s=g.subtasks.find(x=>x.id===sid); if(s&&!s.done){ s.done=true; s.doneAt=t; touch(g); touched.add(g.id); n++; } }
    }
    for(const r of filled()){
      state.goals.push({id:uid(), title:r.text.trim(), desc:'', categoryId:r.cat||null, deadline:'', time:'', priority:'med', reminder:'none',

    const full=[...touched].map(goalById).filter(g=>g&&g.status==='active'&&g.subtasks.length&&g.subtasks.every(s=>s.done));
    if(full.length){
      const closeIds=await askCloseGoals(full);
      for(const id of closeIds){ const g=goalById(id); g.status='done'; g.completedAt=t; touch(g); n++; }
      if(closeIds.size){ save(); render(); }
    }
    return {n, added};
  }
  m.sheet.addEventListener('click',async e=>{
    const b=e.target.closest('[data-a]'); if(!b) return; const a=b.dataset.a;
    if(a==='close') return m.close();
    if(a==='expand'){ const id=b.dataset.id; open.has(id)?open.delete(id):open.add(id); m.render(); return; }

    if(a==='pick'){ const k=b.dataset.k; sel.has(k)?sel.delete(k):sel.add(k); m.render(); return; }
    if(a==='rm-step'){ const gid=b.dataset.g; pending[gid]=(pending[gid]||[]).filter(p=>p.id!==b.dataset.s); sel.delete('s|'+gid+'|'+b.dataset.s); if(!pending[gid].length) delete pending[gid]; m.render(); return; }
    if(a==='nt-done'){ const r=rowOf(b); r.done=!r.done; m.render(); return; }
    if(a==='nt-rm'){ const r=rowOf(b); rows.splice(rows.indexOf(r),1); if(!rows.length) rows.push({id:uid(),text:'',cat:defCat,done:true}); m.render(); return; }
    if(a==='nt-add'){ const last=rows[rows.length-1]; rows.push({id:uid(), text:'', cat:last?last.cat:defCat, done:true}); m.render(); const ins=$$('.nt-text',m.sheet); ins[ins.length-1].focus(); return; }
    if(a==='confirm'){
      const {n, added}=await apply();
      if(n) showPraise(n);
      else toast(added?`Додано ${added} ${plural(added,['задачу','задачі','задач'])}`:'Збережено');
    }
    if(a==='rest'){
      const {n}=await apply();
      showRest(n);
    }
  });
}
function askCloseGoals(goals){
  return new Promise(res=>{
    const pick=new Set(goals.map(g=>g.id)); let result=new Set();
    const one=goals.length===1;
    const m=openModal(()=>`<div class="hero" style="font-size:56px;text-align:center;margin:4px 0">✅</div>
      <h2 style="text-align:center">${one?'Усі кроки виконано!':'У цих задачах виконано всі кроки!'}</h2>
      <p class="small" style="text-align:center;margin:4px 0 14px">${one?'Закрити цю задачу як виконану?':'Відміть, які задачі закрити як виконані.'}</p>
      ${one?`<div class="rv-item"><div class="rv-row"><div class="grow"><div class="tt">${esc(goals[0].title)}</div><div class="small">${goals[0].subtasks.length} з ${goals[0].subtasks.length} ${plural(goals[0].subtasks.length,['кроку','кроків','кроків'])}</div></div></div></div>`
        : goals.map(g=>`<div class="rv-item"><button class="rv-row ${pick.has(g.id)?'sel':''}" data-pick="${esc(g.id)}"><span class="check ${pick.has(g.id)?'on':''}">${ICONS.check}</span><div class="grow"><div class="tt">${esc(g.title)}</div><div class="small">${g.subtasks.length} з ${g.subtasks.length} ${plural(g.subtasks.length,['кроку','кроків','кроків'])}</div></div></button></div>`).join('')}
      <div class="btn-row" style="flex-direction:column;margin-top:14px">
        <button class="btn success block" data-a="yes" ${pick.size?'':'disabled'}>${one?'Так, закрити задачу':`Закрити вибрані (${pick.size})`}</button>
        <button class="btn block" data-a="no">Ні, залишити активн${one?'ою':'ими'}</button></div>`, {dialog:true, onClose:()=>res(result)});
    m.sheet.addEventListener('click',e=>{
      const p=e.target.closest('[data-pick]'); if(p){ const id=p.dataset.pick; pick.has(id)?pick.delete(id):pick.add(id); m.render(); return; }
      const b=e.target.closest('[data-a]'); if(!b) return;
      if(b.dataset.a==='yes'){ result=new Set(pick); m.close(); }
      if(b.dataset.a==='no'){ m.close(); }
    });
  });
}
function showPraise(n){

function startTour(first){
  if(tourActive) return; tourActive=true;
  const prev={view:ui.view, status:ui.status, cat:ui.cat, gmode:uiPref('goalsMode','list'), cmode:uiPref('calMode','month')}; setUiPref('goalsMode','list');
  ui.status='active'; ui.cat='all';
  // тимчасова задача-приклад (дедлайн учора, щоб показати «Перепланувати»)
  const y=new Date(); y.setDate(y.getDate()-1);
  state.goals=state.goals.filter(g=>g.id!==TOUR_SAMPLE);
  state.goals.unshift({id:TOUR_SAMPLE, title:'Приклад: прочитати книгу', desc:'', categoryId:(state.categories[0]||{}).id||null, deadline:ymd(y), time:'',
    priority:'med', reminder:'none', status:'active', createdAt:nowIso(), updatedAt:nowIso(), completedAt:null,
    subtasks:[{id:'ts1',title:'Розділ 1',done:true,doneAt:nowIso()},{id:'ts2',title:'Розділ 2',done:false,doneAt:null},{id:'ts3',title:'Розділ 3',done:false,doneAt:null}]});
  const root=document.createElement('div'); root.className='tour';
  root.innerHTML='<div class="tour-hole"></div><div class="tour-tip" role="dialog" aria-live="polite"></div>';
  document.body.appendChild(root);
  const hole=$('.tour-hole',root), tip=$('.tour-tip',root);
  let i=0, ctx=null, cur=null;
  const closeAll=()=>{ while(modalStack.length) modalStack[modalStack.length-1].close(); };
  async function setCtx(c){
    if(c===ctx) return false;
    closeAll(); ctx=c;
    if(c==='form') openGoalForm(null);
    else if(c==='detail') openGoal(TOUR_SAMPLE);
    else if(c==='review') await openReview();
    return true;
  }
  function place(){
    const s=TOUR[i], vw=innerWidth, vh=innerHeight, w=Math.min(360, vw-24);
    tip.style.width=w+'px';
    if(!cur){ hole.style.cssText=`left:${vw/2}px;top:${vh/2}px;width:0;height:0`; tip.style.left=(vw-w)/2+'px'; tip.style.top=Math.max(12,(vh-tip.offsetHeight)/2)+'px'; return; }
    const rs=cur.map(e=>e.getBoundingClientRect()), p=s.pad??8;
    const L=Math.min(...rs.map(x=>x.left)), T=Math.max(4,Math.min(...rs.map(x=>x.top))), R=Math.max(...rs.map(x=>x.right)), B=Math.min(vh-4,Math.max(...rs.map(x=>x.bottom)));
    const r={left:L, top:T, right:R, bottom:B, width:R-L, height:Math.max(0,B-T)};
    hole.style.cssText=`left:${r.left-p}px;top:${r.top-p}px;width:${r.width+p*2}px;height:${r.height+p*2}px`;
    const th=tip.offsetHeight; let top;
    if(r.bottom+p+12+th < vh-8) top=r.bottom+p+12;
    else if(r.top-p-12-th > 8) top=r.top-p-12-th;
    else top=vh-th-12;
    tip.style.top=top+'px';
    tip.style.left=Math.min(Math.max(12, r.left+r.width/2-w/2), vw-w-12)+'px';
  }
  let busy=false;
  async function show(dir=1){
    busy=true; try{ await showInner(dir); } finally{ busy=false; }
  }
  async function showInner(dir){
    const s=TOUR[i];
    if(s.view==='goals'){ const want=s.cal?'cal':'list'; if(uiPref('goalsMode','list')!==want){ setUiPref('goalsMode',want); if(s.cal){ setUiPref('calMode','month'); ui.calDate=startOfDay(new Date()); } if(ui.view==='goals') render(); } }
    if(s.view && ui.view!==s.view){ await setCtx(null); ui.view=s.view; render(); }
    const changed = s.center ? await setCtx(null) : await setCtx(s.ctx||null);
    await new Promise(r=>setTimeout(r, changed?380:40));
    cur=null;
    if(!s.center){
      let el=null; for(const q of s.sel.split(',')){ el=document.querySelector(q.trim()); if(el) break; }
      if(el && s.up) el=el.closest(s.up)||el;
      if(!el){ const n=i+dir; if(n>=0 && n<TOUR.length){ i=n; return showInner(dir); } }
      if(el){
        const extra=(s.also||[]).map(([q,u])=>{ const e=document.querySelector(q); return e&&u?(e.closest(u)||e):e; }).filter(Boolean);
        // додаємо заголовок блоку (і його короткий опис), що стоїть одразу над елементом
        const withHeader=e=>{ const out=[e]; let p=e.previousElementSibling;
          while(p && p.matches('p.small')){ out.unshift(p); p=p.previousElementSibling; }
          if(p && p.matches('h2.section-title, h3')) out.unshift(p);
          return out.length>1 && out[0].matches('h2, h3') ? out : [e]; };
        cur=[...new Set([el,...extra].flatMap(withHeader))];
        const topmost=cur.reduce((a,b)=>a.getBoundingClientRect().top<=b.getBoundingClientRect().top?a:b);
        (cur.length>1?topmost:el).scrollIntoView({block: cur.length>1?'start':'center', behavior:'instant'});
        await new Promise(r=>requestAnimationFrame(()=>setTimeout(r,60)));
      }
    }
    tip.innerHTML=`<div class="small" style="font-weight:700;margin-bottom:4px">${i+1} / ${TOUR.length}</div>
      <div class="tt">${s.t}</div><div class="tx">${s.x}</div>
      <div class="tour-nav">${s.last?'':'<button class="btn ghost" data-t="skip">Пропустити</button>'}<span style="flex:1"></span>
        ${i>0&&!s.last?'<button class="btn" data-t="prev">←</button>':''}
        ${s.last?'<button class="btn" data-t="slides">📖 Опис функцій</button><button class="btn primary" data-t="end">Почнімо! ✨</button>':`<button class="btn primary" data-t="next">${i===0?'Почати тур →':'Далі →'}</button>`}</div>`;
    place();
  }
  function end(openSlides){
    tourActive=false; root.remove(); closeAll();
    window.removeEventListener('resize',place); window.removeEventListener('keydown',onKey);
    state.goals=state.goals.filter(g=>g.id!==TOUR_SAMPLE);
    ui.view=first?'goals':prev.view; ui.status=prev.status; ui.cat=prev.cat; setUiPref('goalsMode', prev.gmode); setUiPref('calMode', prev.cmode);
    if(!state.settings.tutorialSeen) state.settings.tutorialSeen=true;
    save(); render(); window.scrollTo(0,0);
    if(openSlides) setTimeout(()=>openTutorial(false),300);
    else if(first) toast('Гарного старту! Натисни «+», щоб додати першу задачу');
  }
  const onKey=e=>{ if(busy) return; if(e.key==='Escape') end(); if(e.key==='ArrowRight'&&i<TOUR.length-1){ i++; show(1);} if(e.key==='ArrowLeft'&&i>0){ i--; show(-1);} };
  tip.addEventListener('click',e=>{
    const b=e.target.closest('[data-t]'); if(!b||busy) return; const a=b.dataset.t;
    if(a==='next'&&i<TOUR.length-1){ i++; show(1); }
    if(a==='prev'&&i>0){ i--; show(-1); }
    if(a==='skip'||a==='end') end(false);
    if(a==='slides') end(true);
  });
  window.addEventListener('resize',place); window.addEventListener('keydown',onKey);
  render(); show(1);
}
