/* ---- Святкові картинки (зберігаються в IndexedDB) ---- */
let images=[];
function mediaDb(){ return new Promise((res,rej)=>{ if(!('indexedDB' in window)) return rej('no idb'); const r=indexedDB.open('tracker-media',1); r.onupgradeneeded=()=>r.result.createObjectStore('images',{keyPath:'id'}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function mediaTx(mode, fn){ const db=await mediaDb(); return new Promise((res,rej)=>{ const t=db.transaction('images',mode); const out=fn(t.objectStore('images')); t.oncomplete=()=>res(out&&out.result); t.onerror=()=>rej(t.error); }); }
async function loadImages(){ try{ images=(await mediaTx('readonly',s=>s.getAll()))||[]; images.sort((a,b)=>(a.addedAt||'').localeCompare(b.addedAt||'')); }catch(e){ images=[]; } }
function resizeImage(file, max=1280){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.85)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej('bad image'); };
    img.src=url;
  });
}
async function addImageFiles(files){
  let n=0;
  for(const f of files){ if(!f.type.startsWith('image/')) continue;
    try{ const rec={id:uid(), data:await resizeImage(f), addedAt:nowIso()}; await mediaTx('readwrite',s=>s.put(rec)); images.push(rec); n++; }catch(e){} }
  toast(n?`Додано ${n} ${plural(n,['картинку','картинки','картинок'])}`:'Не вдалося додати картинку'); render(); schedulePush();
}

/* ---- Редактор категорії ---- */
/* Кольори: hex ↔ HSL (для палітри) */
function hexToHsl(hex){ let m=/^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return {h:250,s:65,l:50}; const n=parseInt(m[1],16); let r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let h=0,s=0,l=(mx+mn)/2;
  if(mx!==mn){ const d=mx-mn; s=l>.5?d/(2-mx-mn):d/(mx+mn); h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4; h*=60; }
  return {h:Math.round(h), s:Math.round(s*100), l:Math.round(l*100)}; }
function hslToHex(h,s,l){ s/=100; l/=100; const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l), f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join(''); }
/* Перший символ-емодзі з рядка (з урахуванням складених емодзі: 👨‍👩‍👧, 🏳️‍🌈, прапорів тощо) */
function firstEmoji(str){
  const parts = window.Intl && Intl.Segmenter ? [...new Intl.Segmenter('uk',{granularity:'grapheme'}).segment(str)].map(x=>x.segment) : Array.from(str);
  for(let i=parts.length-1;i>=0;i--){ if(/\p{Extended_Pictographic}|\p{Regional_Indicator}|[\u20E3\uFE0F]/u.test(parts[i])) return parts[i]; }
  return '';
}

async function importFile(file){
  let obj;
  try{ obj=JSON.parse(await file.text()); }catch(e){ toast('Це не схоже на файл резервної копії'); return; }
  const data = obj && obj.app==='achievement-tracker' ? obj.data : (obj && Array.isArray(obj.goals) ? obj : null);
  if(!data || !Array.isArray(data.goals)){ toast('Файл не містить даних трекера'); return; }
  const inc=normalize(data);
  const incImgs=(Array.isArray(obj.images)?obj.images:[]).filter(i=>i&&i.id&&typeof i.data==='string'&&i.data.startsWith('data:image/')).map(i=>({id:String(i.id),data:i.data,addedAt:i.addedAt||nowIso()}));
  const when=obj.exportedAt?new Date(obj.exportedAt).toLocaleString('uk-UA',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}):'невідомо';
  const mode=await dialog({title:'Імпорт резервної копії',
    text:`Копія від ${esc(when)}: ${inc.goals.length} ${plural(inc.goals.length,['задача','задачі','задач'])}, ${inc.categories.length} ${plural(inc.categories.length,['категорія','категорії','категорій'])}${incImgs.length?`, ${incImgs.length} ${plural(incImgs.length,['картинка','картинки','картинок'])}`:''}.<br><br><b>Об’єднати</b>: додати нове й оновити змінене, нічого не видаляючи.<br><b>Замінити</b>: поточні дані буде повністю замінено копією.`,
    buttons:[{label:'Об’єднати',value:'merge',kind:'primary'},{label:'Замінити все',value:'replace',kind:'danger'},{label:'Скасувати',value:null}]});
  if(!mode) return;
  if(incImgs.length || mode==='replace') await importImages(mode==='replace'?incImgs:incImgs.filter(i=>!images.some(x=>x.id===i.id)), mode==='replace');
  if(mode==='replace'){
    const keep={theme:state.settings.theme};
    state=inc; state.settings.theme=keep.theme;
  } else {
    for(const c of inc.categories) if(!state.categories.some(x=>x.id===c.id)) state.categories.push(c);
    let added=0, updated=0;
    for(const g of inc.goals){
      const ex=goalById(g.id);
      if(!ex){ state.goals.push(g); added++; }
      else if((g.updatedAt||'')>(ex.updatedAt||'')){ Object.assign(ex,g); updated++; }
    }
    for(const k in inc.badges) if(!state.badges[k]) state.badges[k]=inc.badges[k];
    toast(`Додано: ${added}, оновлено: ${updated}`);
  }
  save(); render(); checkBadges();
  if(mode==='replace') toast('Дані відновлено з копії');
}

async function pushNow(){
  if(!sync.user) return; if(!sync.ready){ schedulePush(); return; }
  const F=FB, db=sync.db, uid=sync.user.uid; const ops=[];
  const cur=new Map(state.goals.filter(g=>g.id!==TOUR_SAMPLE).map(g=>[g.id,g]));
  for(const [id,g] of cur){ const c=canon(g); if(sync.remote.goals.get(id)!==c){ ops.push(['set',F.doc(db,'users',uid,'goals',id),clean(g)]); sync.remote.goals.set(id,c); } }
  for(const id of [...sync.remote.goals.keys()]) if(!cur.has(id)){ ops.push(['del',F.doc(db,'users',uid,'goals',id)]); sync.remote.goals.delete(id); }
  const cc=new Map(state.categories.map(c=>[c.id,c]));
  for(const [id,c0] of cc){ const c=canon(c0); if(sync.remote.categories.get(id)!==c){ ops.push(['set',F.doc(db,'users',uid,'categories',id),clean(c0)]); sync.remote.categories.set(id,c); } }
  for(const id of [...sync.remote.categories.keys()]) if(!cc.has(id)){ ops.push(['del',F.doc(db,'users',uid,'categories',id)]); sync.remote.categories.delete(id); }

  for(const id of [...sync.remote.images]) if(!images.some(i=>i.id===id)){ ops.push(['del',F.doc(db,'users',uid,'images',id)]); sync.remote.images.delete(id); }
  const fk=new Map(feed.map(f=>[f.key,f]));
  for(const [k,f] of fk){ const c=canon(feedItem(f)); if(sync.remote.feed.get(k)!==c){ ops.push(['set',F.doc(db,'users',uid,'feed',feedDocId(k)),feedItem(f)]); sync.remote.feed.set(k,c); } }
  for(const k of [...sync.remote.feed.keys()]) if(!fk.has(k)){ ops.push(['del',F.doc(db,'users',uid,'feed',feedDocId(k))]); sync.remote.feed.delete(k); }

  setSyncStatus('syncing');
  try{
    // картинки — окремими записами (великі), решта — пачками
    for(let i=0;i<ops.length;i+=20){ const b=F.writeBatch(db); for(const [t,ref,data] of ops.slice(i,i+20)) t==='set'?b.set(ref,data):b.delete(ref); await b.commit(); }
    setSyncStatus('ok');
  }catch(e){ setSyncStatus('error', fbErr(e)); }
}

const AI_MODELS=['gemini-2.5-flash','gemini-2.5-flash-lite','gemini-3-flash-preview','gemini-flash-latest'];
let aiLastErr='';
// Адреса «посередника» на Cloudflare: запити до ШІ йдуть через нього й лише для тих, хто увійшов в акаунт
const AI_PROXY_URL='';
const AI_OK = !!(window.FB && FB.getAI) && typeof DEMO_SEED!=='function';
const SpeechWeb = window.SpeechRecognition || window.webkitSpeechRecognition;
const speechNative = ()=> NATIVE && !!(CP && CP.SpeechRecognition);
const speechOK = ()=> speechNative() || (!NATIVE && !!SpeechWeb);
const aiCache={};
function aiModel(i){
  if(!sync.app) throw new Error('no-app');
  if(!aiCache[i]){ const ai=FB.getAI(sync.app,{backend:new FB.GoogleAIBackend()});
    aiCache[i]=FB.getGenerativeModel(ai,{model:AI_MODELS[i], generationConfig:{responseMimeType:'application/json', temperature:0.2}}); }
  return aiCache[i];
}
const pickJSON=t=>{ const a=t.indexOf('{'), b=t.lastIndexOf('}'); if(a<0||b<a) throw new Error('bad-json: '+String(t).slice(0,120)); return JSON.parse(t.slice(a,b+1)); };
async function aiJSON(prompt){
  if(AI_PROXY_URL){
    if(!sync.user){ const e=new Error('need-login'); e.code='need-login'; aiLastErr='need-login'; throw e; }
    let r, d={};
    try{
      const tok=await sync.user.getIdToken();
      r=await fetch(AI_PROXY_URL,{method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok}, body:JSON.stringify({prompt})});
      d=await r.json().catch(()=>({}));
    }catch(e){ aiLastErr='[proxy] '+String(e&&e.message||e); throw new Error('network '+aiLastErr); }
    if(!r.ok){ aiLastErr=`[proxy ${r.status}] ${d.error||''} ${d.status||''} ${d.message||''}`.slice(0,300); throw new Error((r.status===429?'429 quota ':'')+aiLastErr); }
    return pickJSON(d.text||'');
  }
  let last;
  for(let i=0;i<AI_MODELS.length;i++){
    try{
      const r=await aiModel(i).generateContent(prompt);
      const t=r.response.text(); const a=t.indexOf('{'), b=t.lastIndexOf('}');
      if(a<0||b<a) throw new Error('bad-json: '+t.slice(0,120));
      return JSON.parse(t.slice(a,b+1));
    }catch(e){ last=e; aiLastErr=`[${AI_MODELS[i]}] `+String((e&&(e.code||''))+' '+(e&&e.message||e)).slice(0,300); console.log('AI error', aiLastErr);
      if(!navigator.onLine || /quota|429|RESOURCE_EXHAUSTED/i.test(String(e&&e.message))) break; }
  }
  throw last;
}
function aiErr(e){
  const m=String(e&&e.message||e);
  if(!navigator.onLine || /network|failed to fetch/i.test(m)) return 'Немає інтернету — без нього ШІ не працює.';
  if(/need-login/.test(m)) return 'ШІ доступний після входу в акаунт.';
  if(/no-app/.test(m)) return 'ШІ ще не запустився. Закрий і знову відкрий застосунок.';
  if(/api-not-enabled|has not been used|PERMISSION_DENIED|SERVICE_DISABLED|403/i.test(m)) return 'ШІ ще не ввімкнено у Firebase. Відкрий AI services → AI Logic → Gemini Developer API.';
  if(/quota|429|RESOURCE_EXHAUSTED/i.test(m)) return 'Вичерпано безкоштовний ліміт ШІ. Спробуй трохи пізніше.';

/* Вікно запису голосу. Повертає текст (його можна виправити руками) або null.

      ${canSpeak?`<div class="voice-wrap"><button class="mic" data-a="mic" aria-label="Мікрофон">🎤</button><div class="small" id="vstat">Натисни на мікрофон і говори</div></div>`:'<div class="small" style="margin:8px 0">Голосове введення недоступне на цьому пристрої — напиши своїми словами.</div>'}

    // ручне редагування під час запису: новий текст продовжиться після виправленого
    ta.addEventListener('input',()=>{ if(state!=='idle'){ base=ta.value.trim(); skip=lastT.length; } });
    if(canSpeak) setTimeout(()=>begin(false), 200);   // запис стартує автоматично
  });
}

/* Нова задача голосом */
async function voiceFillTask(fill){
  const text=await voiceCapture({title:'🎤 Розкажи про задачу',
    hint:'Говори як зручно, наприклад: «Завтра о шостій вечора подзвонити в банк щодо кредиту, це по роботі, важливо. Спершу знайти договір».',
    placeholder:'Тут з’явиться те, що ти скажеш. Можна й написати.'});
  if(!text) return;
  const cats=state.categories.map(c=>({id:c.id, name:c.name}));
  const prompt=`Ти — помічник у застосунку-трекері задач. ${todayCtx()}
Користувач продиктував українською нову задачу: """${text}"""
Категорії користувача: ${JSON.stringify(cats)}
Поверни ЛИШЕ JSON-об'єкт:
{"title": "коротка назва задачі з великої літери — сама дія, без дати, часу, категорії й пріоритету",
 "desc": "додаткові деталі, якщо вони є, інакше порожній рядок",
 "categoryId": "id найвідповіднішої категорії з наданого списку, або порожній рядок, якщо незрозуміло",
 "deadline": "YYYY-MM-DD або порожній рядок (обчислюй відносні дати: сьогодні, завтра, післязавтра, у п'ятницю — найближча майбутня, через тиждень, до кінця місяця)",
 "time": "HH:MM у 24-годинному форматі або порожній рядок (\\"о шостій вечора\\" = 18:00, \\"зранку\\" = 09:00)",
 "priority": "high, якщо важливо/терміново/обов'язково; low, якщо не горить/колись; інакше med",
 "reminder": "одне з: none, 0, 1h, 1d, 3d, 1w — якщо користувач просив нагадати; інакше порожній рядок",
 "subtasks": ["кроки, якщо користувач перелічив етапи; інакше порожній масив"]}`;
  let r; try{ r=await withLoading(aiJSON(prompt)); }catch(e){ return aiFail(e); }
  if(!r || !r.title){ return aiFail(new Error('empty')); }
  fill(r); toast('✨ Заповнено — перевір і натисни «Створити задачу»');
}

/* Підсумок дня голосом */
async function voiceReview(ctx){
  const text=await voiceCapture({title:'🎤 Розкажи, що зроблено',
    hint:`Просто розкажи про свій день, наприклад: «${G3('Зробив','Зробила','Зроблено')} слайди для презентації, ${G3('подзвонив','подзвонила','дзвінок')} в банк, а ще ${G3('сходив','сходила','похід')} у спортзал».`,
    placeholder:'Тут з’явиться те, що ти скажеш. Можна й написати.'});
  if(!text) return;
  const tasks=ctx.list.map(g=>({id:g.id, title:g.title, steps:[...g.subtasks, ...(ctx.pending[g.id]||[])].map(s=>({id:s.id, title:s.title, done:!!s.done}))}));
  const cats=state.categories.map(c=>({id:c.id, name:c.name}));
  const prompt=`Ти — помічник у застосунку-трекері задач. ${todayCtx()}
Користувач розповідає українською, що зробив сьогодні: """${text}"""
Його активні задачі з кроками: ${JSON.stringify(tasks)}
Категорії: ${JSON.stringify(cats)}
Зістав розповідь із задачами за змістом (не лише за точними словами). Правила:
- doneTaskIds: задачі БЕЗ кроків, які користувач виконав; або задачі з кроками, якщо він прямо каже, що завершив задачу повністю.
- doneSteps: існуючі невиконані кроки, які він зробив.
- newSteps: якщо він зробив частину існуючої задачі, якої немає серед кроків, — новий крок до цієї задачі (done: true).
- newTasks: справи, що не стосуються жодної задачі (title — коротко, з великої літери; categoryId — з наданих або порожній рядок; done: true).
- Нічого не вигадуй: лише те, що прозвучало.
Поверни ЛИШЕ JSON: {"doneTaskIds":[], "doneSteps":[{"taskId":"","stepId":""}], "newSteps":[{"taskId":"","title":"","done":true}], "newTasks":[{"title":"","categoryId":"","done":true}], "summary":"одне коротке речення українською: що ти відмітив"}`;
  let r; try{ r=await withLoading(aiJSON(prompt)); }catch(e){ return aiFail(e); }
  const ids=new Set(ctx.list.map(g=>g.id)); let n=0;
  for(const id of (r.doneTaskIds||[])){ if(!ids.has(id)) continue; const g=goalById(id); const all=[...g.subtasks, ...(ctx.pending[id]||[])];
    if(!all.length){ ctx.sel.add('g|'+id); n++; } else { for(const s of all) if(!s.done){ ctx.sel.add('s|'+id+'|'+s.id); n++; } ctx.open.add(id); } }
  for(const d of (r.doneSteps||[])){ if(!ids.has(d.taskId)) continue; const g=goalById(d.taskId);
    const s=[...g.subtasks, ...(ctx.pending[d.taskId]||[])].find(x=>x.id===d.stepId); if(s && !s.done){ ctx.sel.add('s|'+d.taskId+'|'+s.id); ctx.open.add(d.taskId); n++; } }
  for(const ns of (r.newSteps||[])){ if(!ids.has(ns.taskId) || !ns.title) continue; const st={id:uid(), title:String(ns.title).slice(0,200)};
    (ctx.pending[ns.taskId]=ctx.pending[ns.taskId]||[]).push(st); ctx.sel.delete('g|'+ns.taskId); if(ns.done!==false){ ctx.sel.add('s|'+ns.taskId+'|'+st.id); n++; } ctx.open.add(ns.taskId); }
  const nt=(r.newTasks||[]).filter(t=>t&&t.title);
  if(nt.length){ for(let i=ctx.rows.length-1;i>=0;i--) if(!ctx.rows[i].text.trim()) ctx.rows.splice(i,1);
    for(const t of nt){ ctx.rows.push({id:uid(), text:String(t.title).slice(0,140), cat:state.categories.some(c=>c.id===t.categoryId)?t.categoryId:((state.categories[0]||{}).id||''), done:t.done!==false}); n++; } }
  ctx.render();
  if(n) toast('✨ '+(r.summary||'Відмічено')+' — перевір і натисни «Підтвердити»');
  else dialog({title:'Нічого не знайшлося 🤔', text:'ШІ не зміг зіставити розповідь із задачами. Спробуй розповісти трохи детальніше або відміть вручну.', buttons:[{label:'Добре',value:1,kind:'primary'}]});
}

/* ========== Власні випадаючі списки (замість системних) ========== */
const selValDesc=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value');
const CHEV_DOWN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
function enhanceSelect(sel){
  if(sel.dataset.enh) return; sel.dataset.enh='1'; sel.classList.add('enhanced');
  const btn=document.createElement('button'); btn.type='button';
  btn.className=sel.className.replace(/\benhanced\b/,'').trim()+' select-btn';
  if(sel.getAttribute('style')) btn.setAttribute('style', sel.getAttribute('style'));
  if(sel.getAttribute('aria-label')) btn.setAttribute('aria-label', sel.getAttribute('aria-label'));
  btn.innerHTML=`<span class="sv"></span>${CHEV_DOWN}`;
  const upd=()=>{ const o=sel.options[sel.selectedIndex]; btn.querySelector('.sv').textContent=o?o.textContent:''; };
  sel.after(btn); upd();
  // будь-яка програмна зміна значення одразу оновлює підпис кнопки
  Object.defineProperty(sel,'value',{configurable:true, get(){ return selValDesc.get.call(this); }, set(v){ selValDesc.set.call(this,v); upd(); }});
  sel.addEventListener('change', upd);
  btn.addEventListener('click', e=>{ e.preventDefault(); e.stopPropagation(); openSelectSheet(sel); });
}
function openSelectSheet(sel){
  const lab=sel.closest('label.field, .field'); const sp=lab && lab.querySelector(':scope > span');
  const title=((sp && sp.textContent) || sel.getAttribute('aria-label') || 'Обери варіант').replace('*','').trim();
  const opts=[...sel.options];
  const m=openModal(()=>`<div class="sheet-head"><h2>${esc(title)}</h2><button class="icon-btn" data-a="close" aria-label="Закрити">${ICONS.close}</button></div>
    <div class="opt-list">${opts.map((o,i)=>`<button class="opt ${o.selected?'on':''}" data-i="${i}"><span>${esc(o.textContent)}</span>${o.selected?ICONS.check.replace('<svg','<svg class="ck"'):''}</button>`).join('')}</div>`, {dialog:true});
  m.sheet.addEventListener('click',e=>{
    if(e.target.closest('[data-a=close]')) return m.close();
    const o=e.target.closest('[data-i]'); if(!o) return;
    const v=opts[+o.dataset.i].value; m.close();
    if(sel.value!==v || v==='__new'){ sel.value=v; sel.dispatchEvent(new Event('change',{bubbles:true})); }
  });
}
function enhanceAllSelects(root=document){ root.querySelectorAll('select.input:not([data-enh])').forEach(enhanceSelect); }
new MutationObserver(()=>enhanceAllSelects()).observe(document.body,{childList:true, subtree:true});

if(!NATIVE && 'serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(r=>{ swReg=r; if(notifState()==='granted') registerPeriodic(); }).catch(()=>{});
  navigator.serviceWorker.addEventListener('message',e=>{
    if(!e.data) return;
    if(e.data.openReview) openReview();

    if(e.data.feedChanged) loadFeed();
  });
}

syncSchedule().then(checkReminders);

const qs=new URLSearchParams(location.search), qGoal=qs.get('goal');

else if(!hasGender() || !state.settings.tutorialSeen) setTimeout(async ()=>{
  // новий пристрій: пропонуємо увійти, щоб підтягнути задачі з інших пристроїв
  let known=null; try{ known=localStorage.getItem(SYNC_UID_KEY); }catch(e){}
  if(SYNC_OK && !known && !state.settings.tutorialSeen && !state.goals.length){
    await new Promise(r=>setTimeout(r,600));
    if(!sync.user){
      const v=await dialog({title:'Вже користуєшся застосунком на іншому пристрої?', text:'Увійди у свій акаунт, і твої задачі з’являться тут. Або почни з чистого аркуша — акаунт можна створити пізніше в Налаштуваннях.',
        buttons:[{label:'☁️ Увійти в акаунт',value:'login',kind:'primary'},{label:'Почати з нуля',value:'new'}]});
      if(v==='login'){ const ok=await openAuth('login'); if(ok||sync.user) await waitSyncReady(6000); }
    }
  }
  if(!hasGender()) await askGender();          // спершу питаємо, як звертатися
  if(!state.settings.tutorialSeen) startTour(true);   // перший запуск — інтерактивний тур
}, 400);
